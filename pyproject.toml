[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "applyproof"
version = "0.1.0"
description = "Evidence-first job application preparation with explicit location checks and traceable CV bullets."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "python-multipart==0.0.32", "pypdf>=6,<7"]
[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]
[project.scripts]
applyproof = "applyproof.cli:main"
[tool.setuptools.packages.find]
include = ["applyproof*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
